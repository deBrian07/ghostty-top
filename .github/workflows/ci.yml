name: CI

# `pull_request` (never `pull_request_target`) means a fork's code runs with no
# access to repository secrets, so an untrusted pull request cannot exfiltrate
# anything or write to the repository.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Formatting
        run: cargo fmt --check

      # Warnings fail the build: the tree is expected to be clippy-clean on
      # both platforms, which is what keeps the cfg-gated code honest.
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Includes a test that parses the real `ps` output, so a wrong flag or
      # column name for this platform fails here.
      - name: Tests
        run: cargo test

      - name: Smoke test
        run: |
          cargo build --release
          ./target/release/ghostty-top --version
          ./target/release/ghostty-top --once

  package:
    name: Release artefact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-apple-darwin

      # Proves the published binary still builds for both Mac architectures.
      - name: Universal binary
        run: |
          ./scripts/build-binaries.sh
          lipo -info binaries/ghostty-top | grep -q 'x86_64 arm64'

      - name: Package
        run: npm pack --dry-run
